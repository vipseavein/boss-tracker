<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>Đăng nhập · Boss Tracker</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e6edf3;
      background:
        radial-gradient(circle at 20% 15%, rgba(88,166,255,.18), transparent 34%),
        radial-gradient(circle at 82% 80%, rgba(104,77,255,.13), transparent 36%),
        #0d1117;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .25;
      background-image: linear-gradient(rgba(88,166,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(88,166,255,.08) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, #000, transparent 75%);
    }
    .login-card {
      position: relative;
      width: min(420px, 100%);
      padding: 34px;
      border: 1px solid rgba(88,166,255,.22);
      border-radius: 18px;
      background: rgba(13,22,34,.9);
      box-shadow: 0 30px 90px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.05);
      backdrop-filter: blur(18px);
    }
    .logo {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin-bottom: 22px;
      border: 1px solid rgba(88,166,255,.35);
      border-radius: 15px;
      color: #73b8ff;
      background: rgba(88,166,255,.1);
      box-shadow: 0 0 28px rgba(88,166,255,.16);
    }
    .logo svg { width: 29px; height: 29px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
    .subtitle { margin: 8px 0 26px; color: #8493a9; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 0 0 8px; color: #aebdce; font-size: 13px; font-weight: 700; }
    .field { margin-bottom: 17px; }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      height: 48px;
      padding: 0 46px 0 14px;
      border: 1px solid rgba(139,177,224,.2);
      border-radius: 10px;
      outline: none;
      background: rgba(255,255,255,.045);
      color: #f3f7fc;
      font-size: 15px;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    input:focus { border-color: #58a6ff; background: rgba(88,166,255,.055); box-shadow: 0 0 0 4px rgba(88,166,255,.1); }
    input::placeholder { color: #56667b; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 34px;
      height: 34px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #7f91a8;
      cursor: pointer;
    }
    .password-toggle:hover { color: #c8d8eb; background: rgba(255,255,255,.055); }
    .submit {
      width: 100%;
      height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #258cf4, #5267ef);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(37,140,244,.24);
      transition: transform .16s, filter .16s;
    }
    .submit:hover { transform: translateY(-1px); filter: brightness(1.07); }
    .submit:disabled { cursor: wait; opacity: .68; transform: none; }
    .error {
      display: none;
      margin: 0 0 15px;
      padding: 11px 12px;
      border: 1px solid rgba(255,83,109,.25);
      border-radius: 9px;
      background: rgba(255,55,88,.09);
      color: #ff91a3;
      font-size: 13px;
      line-height: 1.4;
    }
    .error.show { display: block; }
    .footer { margin: 22px 0 0; color: #617086; text-align: center; font-size: 12px; }
    @media (max-width: 480px) { .login-card { padding: 28px 22px; } }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
</head>
<body>
  <main class="login-card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.25 20 7.9v8.2L12 20.75 4 16.1V7.9L12 3.25Z" stroke="currentColor" stroke-width="1.6"/><path d="M9.2 11.2V9.8a2.8 2.8 0 0 1 5.6 0v1.4m-6.8 0h8v5.3H8v-5.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    <h1>Boss Tracker</h1>
    <p class="subtitle">Đăng nhập bằng tài khoản đã được Sonate cấp để tiếp tục.</p>

    <form id="loginForm">
      <div id="errorMessage" class="error" role="alert"></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="name@example.com" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" minlength="6" required>
          <button id="passwordToggle" class="password-toggle" type="button" aria-label="Hiện mật khẩu">◉</button>
        </div>
      </div>
      <button id="submitButton" class="submit" type="submit">LOGIN</button>
    </form>
    <p class="footer">Cabal Ultimate Combo · SEA Server</p>
  </main>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyD78MgA3rKInTGyAzFW7kmuq-xJENbnqSA",
      authDomain: "boss-tracker-893f8.firebaseapp.com",
      databaseURL: "https://boss-tracker-893f8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "boss-tracker-893f8",
      storageBucket: "boss-tracker-893f8.firebasestorage.app",
      messagingSenderId: "279598212615",
      appId: "1:279598212615:web:d2cf2347c697425f77eca2"
    });

    const auth = firebase.auth();
    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const errorMessage = document.getElementById("errorMessage");
    const passwordToggle = document.getElementById("passwordToggle");

    const errorText = {
      "auth/invalid-email": "Địa chỉ email không hợp lệ.",
      "auth/user-disabled": "Tài khoản này đã bị vô hiệu hóa.",
      "auth/user-not-found": "Email hoặc mật khẩu không chính xác.",
      "auth/wrong-password": "Email hoặc mật khẩu không chính xác.",
      "auth/invalid-login-credentials": "Email hoặc mật khẩu không chính xác.",
      "auth/too-many-requests": "Bạn đã thử quá nhiều lần. Vui lòng thử lại sau.",
      "auth/network-request-failed": "Không thể kết nối. Vui lòng kiểm tra Internet."
    };

    auth.onAuthStateChanged(user => {
      if (user && !user.isAnonymous) location.replace("index.html");
    });

    passwordToggle.addEventListener("click", () => {
      const show = password.type === "password";
      password.type = show ? "text" : "password";
      passwordToggle.setAttribute("aria-label", show ? "Ẩn mật khẩu" : "Hiện mật khẩu");
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      errorMessage.classList.remove("show");
      submitButton.disabled = true;
      submitButton.textContent = "Đang đăng nhập...";
      try {
        await auth.signInWithEmailAndPassword(email.value.trim(), password.value);
        location.replace("index.html");
      } catch (error) {
        errorMessage.textContent = errorText[error.code] || "Đăng nhập thất bại. Vui lòng thử lại.";
        errorMessage.classList.add("show");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Đăng nhập";
      }
    });
  </script>
  <script src="i18n.js?v=6.6"></script>
</body>
</html>
