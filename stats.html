<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Tracker - Thống kê</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root{--bg:#0d1117;--panel:#151b23;--panel2:#101720;--border:#2b4058;--text:#e6edf3;--muted:#91a3b7;--blue:#58a6ff;--green:#3fb950;--yellow:#e3b341;--red:#f85149;--purple:#a371f7}
    *{box-sizing:border-box} body{margin:0;padding:28px 28px 90px;background:var(--bg);color:var(--text);font:14px Arial,sans-serif;transition:.25s} body.auth-pending>*{visibility:hidden}
    header{max-width:1500px;margin:0 auto 18px} h1{margin:0;color:var(--blue);font-size:30px;text-shadow:0 0 12px #58a6ff55} .subtitle{color:var(--muted);margin:7px 0 0}
    .toolbar{max-width:1500px;margin:0 auto 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-weight:bold}.updated{color:var(--muted);margin-left:auto}
    main{max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 25px #0003}.card{padding:16px;min-height:105px}.card .label{color:var(--muted);font-size:12px;font-weight:bold;text-transform:uppercase}.card .value{font-size:28px;font-weight:900;margin-top:10px;color:var(--blue)}.card.green .value{color:var(--green)}.card.yellow .value{color:var(--yellow)}.card.red .value{color:var(--red)}.card.purple .value{color:var(--purple)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{padding:18px;min-width:0}.panel.full{grid-column:1/-1}.panel h2{font-size:18px;margin:0 0 14px;color:#8fc7ff}.empty{color:var(--muted);padding:18px 0;text-align:center}
    .rank{display:grid;grid-template-columns:minmax(110px,1fr) 3fr 64px;gap:10px;align-items:center;margin:9px 0}.rank .bar-track,.hour .bar-track{height:9px;background:#243142;border-radius:99px;overflow:hidden}.rank .bar,.hour .bar{height:100%;background:linear-gradient(90deg,#2384f5,#58a6ff);border-radius:99px}.rank .count{text-align:right;font-weight:bold}
    .hours{display:grid;grid-template-columns:repeat(24,1fr);gap:5px;height:150px;align-items:end}.hour{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.hour .bar-track{height:110px;width:100%;display:flex;align-items:flex-end}.hour .bar{width:100%;background:linear-gradient(0deg,#2384f5,#a371f7)}.hour small{font-size:9px;color:var(--muted)}
    .table-wrap{max-height:430px;overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}th{position:sticky;top:0;background:#213047;color:#8fc7ff;z-index:1}tr:hover td{background:#ffffff08}.danger{color:#ff8b86}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#263d58;color:#b9ddff;font-size:12px}
    .nav{position:fixed;z-index:999;border:0;border-radius:7px;color:#fff;font-weight:bold;padding:7px 13px;cursor:pointer;box-shadow:0 4px 14px #0006}.back{right:20px;bottom:20px;background:#f59e28}.log{right:20px;bottom:60px;background:#3478e5}.admin{left:20px;bottom:60px;background:#6f42c1;display:none}.theme{left:20px;bottom:20px;background:#58a6ff}.logout{right:16px;top:56px;background:#d33f45;min-width:104px}
    body.light{--bg:#f2f5f8;--panel:#fff;--panel2:#fff;--border:#b9cce0;--text:#17202b;--muted:#617286;--blue:#075cae}body.light .card,body.light .panel{box-shadow:0 6px 20px #17324d18}body.light th{background:#d9e9fa;color:#174f83}body.light .theme{background:#174f83}
    @media(max-width:1150px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){body{padding:78px 12px 100px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.panel.full{grid-column:auto}.updated{width:100%;margin:0}.hours{gap:2px}.hour small{display:none}}
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="i18n.js?v=6.9.2"></script>
</head>
<body class="auth-pending" data-stats-ui>
  <header><h1>Thống kê Boss Tracker</h1><p class="subtitle">Phân tích dữ liệu hiện có · Chỉ đọc, không ghi Firebase</p></header>
  <div class="toolbar"><label for="period">Khoảng thời gian</label><select id="period"><option value="1">24 giờ / 1 ngày</option><option value="3">3 ngày</option><option value="5">5 ngày</option><option value="7">7 ngày</option></select><span id="updated" role="status">Đang tải...</span></div>
  <main id="report"></main>
  <button class="nav logout" id="logout">LOG OUT</button><button class="nav admin" id="admin">PHÂN QUYỀN</button><button class="nav theme" id="theme">LIGHT MODE</button><button class="nav log" id="log">LOG</button><button class="nav back" id="back">Quay lại trang chính</button>
  <script src="stats-i18n.js?v=6.9.2"></script><script src="stats-model.js?v=6.9.1"></script><script src="stats-app.js?v=6.9.2"></script>
</body>
</html>
